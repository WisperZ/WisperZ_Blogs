# =========================================================
# 主题配置
# =========================================================
[project.theme]
variant = "modern"
language = "zh"

features = [
    # 导航
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.tracking",
    "navigation.tabs",
    "navigation.sections",
    "navigation.expand",
    "navigation.top",
    "navigation.footer",

    # 搜索
    "search.suggest",
    "search.highlight",
    "search.share",

    # 内容增强
    "content.tooltips",
    "content.code.copy",
    "content.code.select",
    "content.code.annotate",
]

# -------------------------
# 主题配色
# -------------------------

# 跟随系统
[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle = { icon = "material/link", name = "关闭自动模式" }

# 日间模式
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/toggle-switch", name = "切换至夜间模式" }

# 夜间模式
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle = { icon = "material/toggle-switch-off-outline", name = "切换至日间模式" }

# =========================================================
# 插件
# =========================================================
[project.plugins.search]
separator = "[\\s\\u200b\\-]"

[project.plugins.blog]
enabled = false
post_date_format = "full"
draft = true
post_readtime = true
post_readtime_words_per_minute = 265


# =========================================================
# Markdown 扩展（关键：修复你当前的格式问题）
# =========================================================
[project.markdown_extensions]

# ---- Python-Markdown 核心扩展 ----
abbr = {}
attr_list = {}
admonition = {}

tables = {}
footnotes = {}

# 目录与标题锚点（解决 #_2 这种问题）
toc = { permalink = true }

# ---- pymdown-extensions（强烈建议） ----

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
linenums = false
guess_lang = true

[project.markdown_extensions.pymdownx.superfences]
# 让代码块、嵌套块稳定解析

[project.markdown_extensions.pymdownx.inlinehilite]
# 支持 `==` 内联代码高亮

[pymdownx.details]
# 折叠块（???）

[pymdownx.tilde]
# ~~删除线~~

[pymdownx.caret]
# ^^上标^^

[pymdownx.mark]
# ==高亮==

[pymdownx.keys]
# ++ctrl+c++

[project.extra.status]
Done = "已完成"
InProgress = "进行中"
Archive = "已归档"
Todo = "待完善"

